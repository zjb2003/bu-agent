[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundlessus-bu-agent"
version = "0.1.0"
description = "BoundlessUs BU assistant runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
bu-agent = "bu_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bu_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

